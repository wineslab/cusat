name: cusat-mobile-backhaul

x-dvb: &dvb
  image: cusat-mobile-backhaul-dvb:sm${CUSAT_CUDA_ARCH}
  build:
    context: .
    dockerfile: deployment/cusat/docker/Dockerfile
    args:
      CUDA_ARCHITECTURES: ${CUSAT_CUDA_ARCH:?run through deployment/cusat-mobile-backhaul/docker/release.sh}
  network_mode: host
  ipc: host
  privileged: true
  init: true
  runtime: nvidia
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  volumes:
    - /dev:/dev
    - ./deployment/cusat-mobile-backhaul/docker/runtime:/opt/cusat-runtime:ro
  command: ["sleep", "infinity"]

services:
  # Non-radio validation target used by release.sh test.
  cusat:
    <<: *dvb
    profiles: [build]

  # Spark owns X410 .20. DVB uses chains 1/3 and usrpproxy gives chain 0 to OAI.
  boat-dvb:
    <<: *dvb
    profiles: [boat]
    cpuset: "${BOAT_DVB_CPUSET:-4-11}"
    volumes:
      - /dev:/dev
      - ./deployment/cusat-mobile-backhaul/docker/runtime:/opt/cusat-runtime:ro
      - ./deployment/cusat-mobile-backhaul/configs/docker/spark-boat.yaml:/etc/cusat/node.yaml:ro

  oai:
    image: cusat-mobile-backhaul-oai:${OAI_IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: deployment/cusat-mobile-backhaul/docker/Dockerfile.oai
      args:
        OAI_REPOSITORY: ${OAI_REPOSITORY:-https://github.com/duranta-project/openairinterface5g.git}
        OAI_REF: ${OAI_REF:-develop}
    profiles: [boat]
    network_mode: host
    ipc: host
    privileged: true
    init: true
    cpuset: "${BOAT_OAI_CPUSET:-12-19}"
    environment:
      CUSAT_TAP: ${CUSAT_TAP_BOAT:-dvbs2a0}
      CUSAT_BOAT_IP: ${CUSAT_BOAT_IP:-10.200.0.1}
      CUSAT_SHORE_IP: ${CUSAT_SHORE_IP:-10.200.0.2}
      CUSAT_USRP_ADDR: ${BOAT_USRP_ADDR:-192.168.40.20}
      PLMN_MCC: ${PLMN_MCC:-001}
      PLMN_MNC: ${PLMN_MNC:-05}
      PLMN_MNC_LENGTH: ${PLMN_MNC_LENGTH:-2}
      TRACKING_AREA_CODE: ${TRACKING_AREA_CODE:-1}
    volumes:
      - ./deployment/cusat-mobile-backhaul/docker/runtime:/opt/cusat-runtime:ro
    command: ["sleep", "infinity"]

  # Thor owns X410 .18 and terminates the DVB link at the ground side.
  shore-dvb:
    <<: *dvb
    profiles: [shore]
    cpuset: "${SHORE_DVB_CPUSET:-4-11}"
    volumes:
      - /dev:/dev
      - ./deployment/cusat-mobile-backhaul/docker/runtime:/opt/cusat-runtime:ro
      - ./deployment/cusat-mobile-backhaul/configs/docker/thor-shore.yaml:/etc/cusat/node.yaml:ro

  # The edge UPF shares the host network namespace with shore-dvb. N2 and N3
  # therefore terminate on the DVB TAP instead of bypassing the satellite link.
  upf:
    image: ${OPEN5GS_IMAGE:-docker.io/gradiant/open5gs:2.7.2}
    profiles: [shore]
    network_mode: host
    privileged: true
    # The upstream image selects the unprivileged open5gs account. This
    # helper also creates ogstun and configures the host-network TAP, routes,
    # sysctls, and firewall rules, so it must start as root.
    user: "0:0"
    init: true
    cpuset: "${SHORE_UPF_CPUSET:-0-3}"
    environment:
      CUSAT_TAP: ${CUSAT_TAP_SHORE:-dvbs2b0}
      CUSAT_BOAT_IP: ${CUSAT_BOAT_IP:-10.200.0.1}
      CUSAT_SHORE_IP: ${CUSAT_SHORE_IP:-10.200.0.2}
      CORE_AMF_IP: ${CORE_AMF_IP:-}
      CORE_AMF_PORT: ${CORE_AMF_PORT:-38412}
      CORE_SMF_PFCP_HOST: ${CORE_SMF_PFCP_HOST:-}
      CORE_SMF_PFCP_PORT: ${CORE_SMF_PFCP_PORT:-8805}
      CORE_DNN: ${CORE_DNN:-oai}
      CORE_UE_SUBNET: ${CORE_UE_SUBNET:-10.45.0.0/16}
      CORE_UE_GATEWAY: ${CORE_UE_GATEWAY:-10.45.0.1}
    volumes:
      - ./deployment/cusat-mobile-backhaul/docker/runtime:/opt/cusat-runtime:ro
    command: ["sleep", "infinity"]
