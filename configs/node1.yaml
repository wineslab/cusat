# ─────────────────────────────────────────────────────────────────────
# dvbs2-uhd-trx configuration — node 1
#
# Mirror of node0 with swapped TX/RX frequencies and channels.
#
# Usage: ./build/apps/dvbs2-uhd-trx --config configs/node1.yaml
# CLI flags still override values set here.
# ─────────────────────────────────────────────────────────────────────

radio:
  usrp: "addr=192.168.40.18"       # UHD device args (default: "")
  tx_freq: 2.05e9                    # TX center frequency in Hz (default: 0)
  rx_freq: 1.95e9                    # RX center frequency in Hz (default: 0)
  tx_gain: 20                       # TX gain in dB (default: 30)
  rx_gain: 20                       # RX gain in dB (default: 30)
  rate: 24.576e6                    # Safe for 1 GbE USRP links (786 Mb/s sc16 payload)
  sym_rate: 6e6                     # 4.096 SPS: conservative, validated smoke-test regime
  tx_channel: 1                     # UHD TX channel index (default: 0)
  rx_channel: 3                     # UHD RX channel index (default: 0)
  # X410 physical order: ch0=A:0, ch1=A:1, ch2=B:0, ch3=B:1.
  # Keep this ordering unless using another USRP model; select the connected
  # cuSAT ports with tx_channel/rx_channel above.
  subdev_spec: "A:0 A:1 B:0 B:1"
  # clock_source: internal          # Clock source: internal, external, gpsdo (default: internal)

modulation:
  modcod: qpsk1/4                   # MODCOD string, e.g. qpsk3/5, 8psk2/3 (default: qpsk3/5)
  # rolloff: 0.2                    # RRC rolloff factor (default: 0.2)
  # gold_code: 0                    # PL scrambling sequence index, 0..262141 (default: 0)
  # short_frames: false             # Use FECFRAME_SHORT 16200 bits (default: false)

agc:
  # rate: 1.0e-5                    # IIR convergence rate per sample (default: 1e-5)
  # ref: 1.0                        # Target RMS amplitude after AGC (default: 1.0)
  # initial_gain: 1.0               # Starting gain multiplier, reset on unlock (default: 1.0)
  # max_gain: 65536.0               # Maximum gain limit ~76 dB (default: 65536.0)

timing_recovery:
  # energy_k: 32                    # Polyphase arms for energy search, 8..64 (default: 32)
  # energy_search_cap: 0            # Max symbols for energy search, 0 = full buffer (default: 0)
  # estimation_period: 4            # Run energy search every Nth call (default: 4)
  # rx_batch_plframes: 2            # PLFRAMEs per timing recovery call (default: 2)
  # rx_min_batch_ms: 0              # Min ms before frontend call, 0 = auto (default: 0)
  # rrc_delay: 5                    # RX matched filter delay in symbols (default: 5)
  # n_subfilt: 128                  # Polyphase subfilter count (default: 128)

lock:
  # soft_unlock_max: 20             # Soft unlock attempts before hard re-acquisition (default: 20)
  # coherence_threshold: 0.5        # Pilot coherence below this = suspicious (default: 0.5)
  # coherence_confirm_thresh: 10    # Good frames to confirm lock after acquisition (default: 10)
  # coherence_unlock_thresh: 20     # Consecutive low-coherence frames to force unlock (default: 20)
  # snr_gate_margin_db: 2.0         # Suppress FEC when SNR this far below threshold (default: 2.0)
  # pls_disagree_thresh: 10         # PLS disagreements before triggering unlock (default: 10)
  # plf_diversity_max: 2            # Max distinct PLFRAME lengths before garbage detect (default: 2)

acm:
  enabled: false                    # Start with CCM; enable after the OTA smoke test
  guard_db: 2.5                     # Headroom above measured FER=1e-5 thresholds
  max_modcod: 26                    # Highest MODCOD index allowed for TX (default: uncapped)
  exclude_modcods: [22, 23]         # MODCOD indices to skip (default: [])
  # fer_ewma_alpha: 0.02            # FER smoothing constant, ~50-frame window (default: 0.02)
  # snr_ewma_alpha: 0.1             # SNR smoothing constant, ~10-sample window (default: 0.1)
  # feedback_interval_ms: 500       # In-band ACM report interval; idle reports use QPSK 1/4
  # snr_hold_frames: 50             # Hold last good SNR during coherence dips, max frames (default: 50)

fec:
  # ldpc_trials: 10                 # Max LDPC belief-propagation iterations (default: 10)
  # batch_timeout_ms: 1             # Flush incomplete LDPC batch after this ms (default: 1)
  # batch_timeout_bootstrap_ms: 500 # Extended flush timeout during acquisition (default: 500)

gpu:
  # batch_ms: 0                     # RX GPU batch cap in ms, 0 = auto (default: 0)
  # ldpc_batch: 16                  # Frames per GPU LDPC decode launch (default: 16)
  # streams: 8                      # CUDA streams for parallel LDPC decode (default: 8)
  # micro_batch: 4                  # Frames per GPU launch within a batch (default: 4)
  # tx_batch: 0                     # TX frames per GPU batch, 0 = auto (default: 0)
  pin_threads: true                 # Requires at least 6 available/dedicated CPU cores
  realtime_threads: false           # Affinity only; SCHED_FIFO is host-tuning opt-in
  cuda_sync: spin                   # Lowest TX latency; safe without SCHED_FIFO promotion

ring_buffer:
  # capacity_s: 2.0                 # RX ring buffer capacity in seconds (default: 2.0)
  # flush_locked_s: 1.5             # Flush ring when backlog exceeds this, locked (default: 1.5)
  # flush_unlocked_s: 0.005         # Flush ring when backlog exceeds this, searching (default: 0.005)
  # keep_after_flush_locked_s: 0.05     # Data retained after flush, locked (default: 0.05)
  # keep_after_flush_unlocked_s: 0.002  # Data retained after flush, searching (default: 0.002)

io:
  tap: dvbs2b0                      # TAP device name for GSE networking (default: "")
  # tx_only: false                  # TX only mode, no RX processing (default: false)
  # rx_only: false                  # RX only mode, no TX processing (default: false)
  log: true                         # Print periodic status to stderr (default: false)
  # debug: 0                        # Debug verbosity 0=off, 1=PLSC, 2=kernels (default: 0)
  # spectrum: false                 # Enable spectrum tap FIFO for dashboard (default: false)

capture:
  # iq_file: ""                     # Dump raw RX IQ to this file path (default: "")
  # duration_s: 5.0                 # Capture duration in seconds (default: 5.0)

channel:
  # noise: false                    # Enable noise injection on TX path (default: false)
  # pathloss: false                 # Enable path loss channel model on TX (default: false)
  # noise_port: 5556                # UDP port for noise/pathloss control (default: 5556)
  # propagation_delay: false        # Enable propagation delay (default: false)
  # pathloss_model: none            # none or freespace, relative to start range
  # distance_km: 0                  # Initial propagation distance in km
